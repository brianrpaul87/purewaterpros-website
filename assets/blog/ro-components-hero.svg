<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Reverse osmosis membrane and carbon prefilter</title>
  <desc id="desc">Clean technical illustration showing a carbon-block prefilter and a spiral-wound reverse-osmosis membrane as two major treatment components in an under-sink drinking-water system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.55" stop-color="#edf7f9"/>
      <stop offset="1" stop-color="#dff2f4"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1">
      <stop offset="0" stop-color="#08243b"/>
      <stop offset="1" stop-color="#123c55"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dce8ec"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" x2="1">
      <stop offset="0" stop-color="#263943"/>
      <stop offset="0.52" stop-color="#101f27"/>
      <stop offset="1" stop-color="#405761"/>
    </linearGradient>
    <linearGradient id="mem" x1="0" x2="1">
      <stop offset="0" stop-color="#9ae7ea"/>
      <stop offset="1" stop-color="#2bb9c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#08243b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1070" cy="92" r="150" fill="#2bb9c9" opacity="0.08"/>
  <circle cx="101" cy="802" r="190" fill="#087ea4" opacity="0.05"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="64" width="192" height="40" rx="20" fill="#d9f4f6"/>
    <text x="166" y="91" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.8" fill="#087ea4">UNDER-SINK RO</text>
    <text x="70" y="164" font-size="52" font-weight="800" fill="#08243b">Two stages that do most of the work</text>
    <text x="70" y="208" font-size="24" fill="#536773">Carbon pretreatment protects the system. The RO membrane handles dissolved-solids reduction.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="280" width="420" height="490" rx="34" fill="#ffffff" stroke="#cbdde2" stroke-width="2"/>
    <rect x="540" y="280" width="590" height="490" rx="34" fill="#ffffff" stroke="#cbdde2" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="338" font-size="20" font-weight="800" letter-spacing="1.6" fill="#0d8f9e">CARBON PREFILTER</text>
    <text x="112" y="374" font-size="22" fill="#536773">Taste, odour and membrane protection</text>
  </g>

  <g transform="translate(157 405)">
    <rect x="66" y="30" width="180" height="250" rx="38" fill="url(#carbon)" stroke="#0b171d" stroke-width="3"/>
    <rect x="46" y="10" width="220" height="62" rx="28" fill="url(#shell)" stroke="#9fb5be" stroke-width="3"/>
    <rect x="46" y="252" width="220" height="62" rx="28" fill="url(#shell)" stroke="#9fb5be" stroke-width="3"/>
    <ellipse cx="156" cy="42" rx="39" ry="13" fill="#cedde2" stroke="#8da4ad" stroke-width="2"/>
    <ellipse cx="156" cy="42" rx="15" ry="6" fill="#68828d"/>
    <ellipse cx="156" cy="283" rx="39" ry="13" fill="#cedde2" stroke="#8da4ad" stroke-width="2"/>
    <ellipse cx="156" cy="283" rx="15" ry="6" fill="#68828d"/>
    <rect x="142" y="56" width="28" height="214" rx="12" fill="#edf6f8" stroke="#8da6b0" stroke-width="2"/>
    <g fill="#5b727c" opacity="0.75">
      <circle cx="95" cy="104" r="4"/><circle cx="118" cy="136" r="4"/><circle cx="93" cy="174" r="4"/><circle cx="120" cy="207" r="4"/><circle cx="96" cy="239" r="4"/>
      <circle cx="217" cy="104" r="4"/><circle cx="194" cy="136" r="4"/><circle cx="219" cy="174" r="4"/><circle cx="192" cy="207" r="4"/><circle cx="216" cy="239" r="4"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="112" y="702" width="336" height="1" fill="#d7e5e9"/>
    <circle cx="128" cy="733" r="7" fill="#2bb9c9"/>
    <text x="148" y="741" font-size="19" fill="#405761">Water moves through the carbon block before reaching the membrane.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="584" y="338" font-size="20" font-weight="800" letter-spacing="1.6" fill="#087ea4">RO MEMBRANE</text>
    <text x="584" y="374" font-size="22" fill="#536773">The pressure-driven separation stage</text>
  </g>

  <g transform="translate(604 425)">
    <rect x="32" y="64" width="430" height="166" rx="82" fill="url(#shell)" stroke="#9fb5be" stroke-width="3"/>
    <ellipse cx="62" cy="147" rx="60" ry="76" fill="#f7fbfc" stroke="#98adb6" stroke-width="3"/>
    <ellipse cx="62" cy="147" rx="43" ry="56" fill="#d8f2f4" stroke="#55bdc8" stroke-width="3"/>
    <ellipse cx="62" cy="147" rx="16" ry="21" fill="#087ea4"/>
    <path d="M111 95 C183 121 206 182 263 210 C319 238 366 218 395 172 C426 124 456 104 480 110" fill="none" stroke="#2bb9c9" stroke-width="23" stroke-linecap="round"/>
    <path d="M117 116 C176 139 201 182 250 197 C297 211 337 195 366 158 C396 119 428 112 469 127" fill="none" stroke="#7edbe1" stroke-width="18" stroke-linecap="round"/>
    <path d="M127 138 C177 151 199 181 237 187 C278 193 309 181 333 153 C360 122 398 124 455 145" fill="none" stroke="#d5f4f6" stroke-width="14" stroke-linecap="round"/>
    <path d="M140 151 C181 158 201 180 230 180 C264 180 288 169 309 145 C336 115 381 131 440 158" fill="none" stroke="url(#mem)" stroke-width="10" stroke-linecap="round"/>
    <rect x="54" y="136" width="426" height="22" rx="11" fill="#087ea4"/>
    <path d="M470 136h90v22h-90z" fill="#087ea4"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(584 690)">
      <rect width="146" height="46" rx="23" fill="#e2f5f7"/><text x="73" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#087ea4">Feed water</text>
      <text x="166" y="30" font-size="26" fill="#7b949e">→</text>
      <rect x="204" width="146" height="46" rx="23" fill="#e2f5f7"/><text x="277" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#087ea4">Permeate</text>
      <text x="370" y="30" font-size="26" fill="#7b949e">+</text>
      <rect x="406" width="156" height="46" rx="23" fill="#eef2f4"/><text x="484" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#536773">Concentrate</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="810" width="1060" height="54" rx="27" fill="url(#navy)"/>
    <text x="600" y="845" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Simplified component illustration — not a plumbing diagram</text>
  </g>
</svg>