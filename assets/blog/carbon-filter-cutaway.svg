<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Simplified carbon block filter cartridge</title>
  <desc id="desc">Technical illustration of a carbon block cartridge showing outside-to-inside flow through the carbon media and centre core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf5f7"/></linearGradient>
    <linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#d8e4e8"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="carbon" x1="0" x2="1"><stop offset="0" stop-color="#24353d"/><stop offset="0.48" stop-color="#0f1f27"/><stop offset="1" stop-color="#354b54"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#08243b" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087ea4"/></marker>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <text x="74" y="86" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#08243b">What does a carbon cartridge do?</text>
  <text x="74" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#536773">A simplified carbon-block cartridge used as drinking-water or RO pretreatment</text>

  <g transform="translate(370 150)" filter="url(#shadow)">
    <rect x="96" y="48" width="268" height="390" rx="44" fill="url(#carbon)" stroke="#0b171d" stroke-width="4"/>
    <rect x="73" y="28" width="314" height="74" rx="32" fill="url(#cap)" stroke="#a8bbc3" stroke-width="4"/>
    <rect x="73" y="402" width="314" height="74" rx="32" fill="url(#cap)" stroke="#a8bbc3" stroke-width="4"/>
    <ellipse cx="230" cy="66" rx="58" ry="20" fill="#d0dde1" stroke="#8ca4ae" stroke-width="3"/>
    <ellipse cx="230" cy="66" rx="21" ry="9" fill="#6d8792"/>
    <ellipse cx="230" cy="438" rx="58" ry="20" fill="#d0dde1" stroke="#8ca4ae" stroke-width="3"/>
    <ellipse cx="230" cy="438" rx="21" ry="9" fill="#6d8792"/>
    <rect x="209" y="78" width="42" height="348" rx="16" fill="#edf6f8" stroke="#8da6b0" stroke-width="3"/>
    <g fill="#566c75" opacity="0.78">
      <circle cx="127" cy="142" r="5"/><circle cx="157" cy="178" r="4"/><circle cx="126" cy="219" r="5"/><circle cx="170" cy="250" r="4"/><circle cx="129" cy="292" r="5"/><circle cx="169" cy="332" r="5"/><circle cx="130" cy="370" r="4"/>
      <circle cx="333" cy="142" r="5"/><circle cx="303" cy="178" r="4"/><circle cx="334" cy="219" r="5"/><circle cx="290" cy="250" r="4"/><circle cx="331" cy="292" r="5"/><circle cx="291" cy="332" r="5"/><circle cx="330" cy="370" r="4"/>
    </g>
  </g>

  <path d="M170 252H438" stroke="#087ea4" stroke-width="9" marker-end="url(#arrow)"/>
  <path d="M170 418H438" stroke="#087ea4" stroke-width="9" marker-end="url(#arrow)"/>
  <text x="84" y="226" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#087ea4">Incoming water</text>
  <text x="84" y="455" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#536773">flows through the carbon block</text>

  <path d="M621 336H1005" stroke="#2bb9c9" stroke-width="9" marker-end="url(#arrow)"/>
  <text x="742" y="303" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0d8f9e">Filtered water exits the centre core</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="100" y="568" width="1000" height="92" rx="18" fill="#ffffff" stroke="#c9d9de"/>
    <circle cx="145" cy="614" r="13" fill="#2bb9c9"/><text x="171" y="621" font-size="22" fill="#334650">Carbon can reduce taste, odour and specific contaminants when the cartridge is certified for those claims.</text>
  </g>
</svg>