<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Simplified spiral-wound reverse osmosis membrane</title>
  <desc id="desc">Technical illustration showing feed water moving across a spiral-wound membrane element, permeate collecting in a centre tube, and concentrate leaving the opposite end.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbfc"/><stop offset="1" stop-color="#e7f4f6"/></linearGradient>
    <linearGradient id="shell" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.52" stop-color="#dfe9ec"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="mem" x1="0" x2="1"><stop offset="0" stop-color="#8fe3e7"/><stop offset="1" stop-color="#2bb9c9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#08243b" flood-opacity="0.15"/></filter>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087ea4"/></marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2bb9c9"/></marker>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <text x="76" y="86" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#08243b">What is inside an RO membrane?</text>
  <text x="76" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#536773">A simplified view of a spiral-wound residential reverse-osmosis element</text>

  <g filter="url(#shadow)">
    <rect x="172" y="248" width="830" height="250" rx="122" fill="url(#shell)" stroke="#a9bcc4" stroke-width="4"/>
    <ellipse cx="220" cy="373" rx="92" ry="112" fill="#f7fbfc" stroke="#9db2ba" stroke-width="4"/>
    <ellipse cx="220" cy="373" rx="66" ry="82" fill="#d9f2f4" stroke="#5abfca" stroke-width="4"/>
    <ellipse cx="220" cy="373" rx="24" ry="31" fill="#087ea4"/>

    <path d="M284 286 C385 330 427 419 505 462 C579 502 659 469 708 396 C757 323 839 282 941 306" fill="none" stroke="#2bb9c9" stroke-width="30" stroke-linecap="round" opacity="0.95"/>
    <path d="M292 318 C378 351 414 421 486 445 C556 468 620 442 664 382 C711 317 799 291 928 326" fill="none" stroke="#7edbe1" stroke-width="24" stroke-linecap="round"/>
    <path d="M307 347 C378 370 410 419 467 431 C528 443 577 420 616 374 C659 323 749 309 914 348" fill="none" stroke="#d5f4f6" stroke-width="19" stroke-linecap="round"/>
    <path d="M325 374 C389 384 418 420 458 420 C507 420 543 401 574 365 C615 319 710 326 899 374" fill="none" stroke="url(#mem)" stroke-width="15" stroke-linecap="round"/>

    <rect x="208" y="357" width="720" height="32" rx="16" fill="#087ea4" opacity="0.96"/>
    <g fill="#e8fbfc" opacity="0.9">
      <circle cx="318" cy="373" r="5"/><circle cx="370" cy="373" r="5"/><circle cx="422" cy="373" r="5"/><circle cx="474" cy="373" r="5"/><circle cx="526" cy="373" r="5"/><circle cx="578" cy="373" r="5"/><circle cx="630" cy="373" r="5"/><circle cx="682" cy="373" r="5"/><circle cx="734" cy="373" r="5"/><circle cx="786" cy="373" r="5"/><circle cx="838" cy="373" r="5"/>
    </g>
    <path d="M912 357h145v32H912z" fill="#087ea4"/>
  </g>

  <path d="M68 373H150" stroke="#087ea4" stroke-width="10" marker-end="url(#arrowA)"/>
  <text x="66" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#087ea4">Feed water</text>

  <path d="M1010 300h116" stroke="#087ea4" stroke-width="10" marker-end="url(#arrowA)"/>
  <text x="963" y="267" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#087ea4">Concentrate</text>

  <path d="M1045 373h82" stroke="#2bb9c9" stroke-width="10" marker-end="url(#arrowB)"/>
  <text x="980" y="429" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0d8f9e">Permeate</text>
  <text x="978" y="458" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536773">treated water</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="122" y="562" width="956" height="92" rx="18" fill="#ffffff" stroke="#c9d9de"/>
    <circle cx="165" cy="608" r="13" fill="#2bb9c9"/><text x="191" y="615" font-size="22" fill="#334650">Membrane leaves are wrapped around a central permeate tube.</text>
    <circle cx="667" cy="608" r="13" fill="#087ea4"/><text x="693" y="615" font-size="22" fill="#334650">Pressure drives water through the membrane; concentrate goes to drain.</text>
  </g>
</svg>