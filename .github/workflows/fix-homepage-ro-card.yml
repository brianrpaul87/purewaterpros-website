name: Fix homepage RO field card

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-homepage-ro-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Replace only the broken first field-experience RO card
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_card = '''<figure class="field-experience-card"><img src="/assets/field-experience/under-sink-ro-drinking-water.webp" alt="Prior field-experience example of an under-sink reverse osmosis drinking-water installation" loading="lazy" decoding="async" width="570" height="760"/><figcaption><strong>Under-sink reverse osmosis</strong><span>Residential drinking-water RO equipment fitted neatly inside an existing kitchen cabinet.</span></figcaption></figure>'''
          new_card = '''<figure class="field-experience-card"><picture><source media="(max-width:620px)" srcset="/images/gallery/_cache/Quick%20Change%20RO%20System_480.webp" type="image/webp"/><source srcset="/images/gallery/_cache/Quick%20Change%20RO%20System_800.webp 800w, /images/gallery/_cache/Quick%20Change%20RO%20System_1200.webp 1200w" sizes="(max-width:900px) 50vw, 33vw" type="image/webp"/><img src="/images/gallery/Quick%20Change%20RO%20System.jpg" alt="Prior field-work example of a residential reverse osmosis drinking-water system" loading="lazy" decoding="async"/></picture><figcaption><strong>Reverse osmosis</strong><span>Prior hands-on field example of residential drinking-water RO equipment.</span></figcaption></figure>'''
          if s.count(old_card) != 1:
              raise SystemExit(f'Expected one broken RO card, found {s.count(old_card)}')
          s = s.replace(old_card, new_card, 1)
          if '/assets/field-experience/under-sink-ro-drinking-water.webp' in s:
              raise SystemExit('Broken curated RO image reference still present')
          for required in (
              '/images/gallery/_cache/Quick%20Change%20RO%20System_480.webp',
              '/images/gallery/_cache/Quick%20Change%20RO%20System_800.webp',
              '/images/gallery/_cache/Quick%20Change%20RO%20System_1200.webp',
              '/images/gallery/Quick%20Change%20RO%20System.jpg',
          ):
              if s.count(required) != 1:
                  raise SystemExit(f'Expected exactly one reference to {required}, found {s.count(required)}')
          p.write_text(s, encoding='utf-8')

      - name: Commit homepage correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace broken homepage RO image with proven gallery asset'
          git push
