name: Fix homepage RO field card

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-homepage-ro-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Reconstruct exact user-provided RO photo
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib

          parts = [
              Path('docs/internal/pwp-ro-exact-2026-09-12.part1.b64'),
              Path('docs/internal/pwp-ro-exact-2026-09-12.part2.b64'),
              Path('docs/internal/pwp-ro-exact-2026-09-12.part3.b64'),
              Path('docs/internal/pwp-ro-exact-2026-09-12.part4.b64'),
          ]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          expected_size = 50518
          expected_sha = '5a0de23980518f3cbaf9a72cc449145fe9a54ba40156bc75e2e8596b605f9274'
          actual_sha = hashlib.sha256(data).hexdigest()
          if len(data) != expected_size:
              raise SystemExit(f'RO photo size mismatch: {len(data)} != {expected_size}')
          if actual_sha != expected_sha:
              raise SystemExit(f'RO photo SHA mismatch: {actual_sha} != {expected_sha}')
          out = Path('images/gallery/pure-water-pros-under-sink-ro.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print(f'Reconstructed exact RO photo: {len(data)} bytes, sha256={actual_sha}')

      - name: Fully decode and validate RO photo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('images/gallery/pure-water-pros-under-sink-ro.webp')
          with Image.open(p) as im:
              im.load()
              if im.format != 'WEBP':
                  raise SystemExit(f'Unexpected image format: {im.format}')
              if im.size != (1200, 904):
                  raise SystemExit(f'Unexpected image dimensions: {im.size}')
              print(f'Full image decode passed: format={im.format}, size={im.size}')
          PY

      - name: Replace only the first homepage RO card
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_card = '''<figure class="field-experience-card"><picture><source media="(max-width:620px)" srcset="/images/gallery/_cache/Quick%20Change%20RO%20System_480.webp" type="image/webp"/><source srcset="/images/gallery/_cache/Quick%20Change%20RO%20System_800.webp 800w, /images/gallery/_cache/Quick%20Change%20RO%20System_1200.webp 1200w" sizes="(max-width:900px) 50vw, 33vw" type="image/webp"/><img src="/images/gallery/Quick%20Change%20RO%20System.jpg" alt="Prior field-work example of a residential reverse osmosis drinking-water system" loading="lazy" decoding="async"/></picture><figcaption><strong>Reverse osmosis</strong><span>Prior hands-on field example of residential drinking-water RO equipment.</span></figcaption></figure>'''
          new_card = '''<figure class="field-experience-card"><img src="/images/gallery/pure-water-pros-under-sink-ro.webp?v=1" alt="Under-sink reverse osmosis drinking-water installation with storage tank" loading="lazy" decoding="async" width="1200" height="904"/><figcaption><strong>Under-sink reverse osmosis</strong><span>New Pure Water Pros installations include standard faucet installation, drilling the sink or countertop where appropriate, and a leak-detection tray at no additional charge.</span></figcaption></figure>'''

          if s.count(old_card) != 1:
              raise SystemExit(f'Expected exactly one current Quick Change RO card, found {s.count(old_card)}')
          s = s.replace(old_card, new_card, 1)
          if s.count('/images/gallery/pure-water-pros-under-sink-ro.webp?v=1') != 1:
              raise SystemExit('Exact RO photo reference missing or duplicated')
          if '/images/gallery/Quick%20Change%20RO%20System.jpg' in s:
              raise SystemExit('Old Quick Change RO card reference still present')
          p.write_text(s, encoding='utf-8')

          expected = {'index.html', 'images/gallery/pure-water-pros-under-sink-ro.webp'}
          status = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          actual = {line[3:] for line in status.splitlines() if line.strip()}
          if actual != expected:
              raise SystemExit(f'Unexpected working-tree changes: {actual!r}; expected {expected!r}')

      - name: Commit exact photo and homepage card only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html images/gallery/pure-water-pros-under-sink-ro.webp
          git commit -m 'Use exact user-provided RO installation photo'
          git push
