name: One-time Pure Water Pros form delivery test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-form-delivery-test.yml'

permissions:
  contents: read

jobs:
  submit-test-inquiry:
    runs-on: ubuntu-latest
    steps:
      - name: Submit real website form test
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 -X POST 'https://www.purewaterpros.ca/contact.php' --data-urlencode 'name=Website Form Test - Do Not Contact' --data-urlencode 'email=website-test@purewaterpros.ca' --data-urlencode 'phone=' --data-urlencode 'postal_code=V9B 3X4' --data-urlencode 'water_source=Not sure' --data-urlencode 'subject=General question' --data-urlencode 'message=END-TO-END WEBSITE FORM TEST. This is a test submission requested by Brian Paul to verify that the Pure Water Pros website inquiry form delivers correctly. No customer follow-up is required.' --data-urlencode 'diagnostic_summary=' --data-urlencode 'consent=accepted' --data-urlencode 'website=')"
          echo "HTTP=$code"
          test "$code" = '303'
