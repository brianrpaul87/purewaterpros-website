name: Sitewide soft-launch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sitewide-soft-launch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update public launch language and footer contact layout
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [
              Path('index.html'),
              Path('water-filtration-victoria.html'),
              Path('water-softeners-victoria.html'),
              Path('reverse-osmosis-victoria.html'),
              Path('uv-water-treatment-victoria.html'),
              Path('iron-sulfur-water-treatment-victoria.html'),
              Path('chemical-injection-water-treatment-victoria.html'),
              Path('low-yield-well-storage-victoria.html'),
              Path('water-treatment-service-victoria.html'),
              Path('service-areas.html'),
              Path('water-treatment-langford-west-shore.html'),
              Path('privacy-policy.html'),
              Path('contact.html'),
              Path('thank-you.html'),
          ]

          literal_replacements = {
              '<div class="launch-strip"><strong>Opening September 2026:</strong> Call or text <a href="tel:+17784001267">778-400-1267</a> or request an appointment online.</div>': '<div class="launch-strip"><strong>Now booking September appointments:</strong> Residential water treatment, RO and equipment service across Greater Victoria and the West Shore.</div>',
              '<div class="launch-strip" role="status">\n<strong>Opening September 2026:</strong> Now accepting calls, questions and advance appointment requests for Greater Victoria and the West Shore.\n  </div>': '<div class="launch-strip" role="status"><strong>Now booking September appointments:</strong> Residential water treatment, RO and equipment service across Greater Victoria and the West Shore.</div>',
              'Request a September appointment': 'Request service',
              'Request September appointment': 'Request service',
              'Request an August follow-up': 'Request service',
              'Request August follow-up': 'Request service',
              'Opening September 2026': 'Now booking September',
              'Opening August 2026': 'Now booking September',
              'Advance appointment requests are now being accepted.': 'Limited appointment availability during our soft launch.',
              'Appointments are expected to begin in the third week of August.': 'Limited appointment availability during our soft launch.',
              'Pure Water Pros is preparing to provide scheduled ': 'Pure Water Pros provides scheduled ',
              'Pure Water Pros is preparing to provide residential and light-commercial ': 'Pure Water Pros provides residential and light-commercial ',
              'Pure Water Pros is preparing to provide ': 'Pure Water Pros provides ',
              'Pure Water Pros will follow up when scheduling opens.': 'Pure Water Pros will review the request and contact you to confirm the appropriate next step and appointment timing.',
              'Availability may vary by service type, travel requirements and opening-week capacity.': 'Availability may vary by service type, travel requirements and scheduling capacity.',
              'Scheduled service elsewhere in Greater Victoria is also planned': 'Scheduled service elsewhere in Greater Victoria is also available',
              'Share the property location, water source and symptoms now so the follow-up can be prepared when scheduling opens.': 'Share the property location, water source and symptoms so we can prepare for the service call and confirm the appropriate appointment timing.',
              'Planning water-treatment appointments for the West Shore.': 'Request water-treatment service for the West Shore.',
              'Planned coverage': 'Service coverage',
              'Pre-launch request': 'Service request',
              'pre-launch request': 'service request',
              'Pre-launch water assessment': 'Water assessment',
              'General pre-launch question': 'General question',
              'Privacy policy for the Pure Water Pros website and pre-launch contact form.': 'Privacy policy for the Pure Water Pros website and service request form.',
              'The pre-launch contact form may collect': 'The service request form may collect',
              'questions and pre-launch service requests': 'questions and service requests',
          }

          changed = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              for old, new in literal_replacements.items():
                  text = text.replace(old, new)

              text = re.sub(
                  r'Pre-launch:\s*appointments are expected to begin in the third week of August 2026\.?',
                  'Now booking September appointments: Residential water treatment, RO and equipment service across Greater Victoria and the West Shore.',
                  text,
                  flags=re.I,
              )
              text = re.sub(r'\bwhen scheduling opens\b', 'when appointment timing is confirmed', text, flags=re.I)
              text = re.sub(r'\bopening-week capacity\b', 'scheduling capacity', text, flags=re.I)

              # Keep email and phone visually separated in every footer.
              text = re.sub(
                  r'(<a class="footer-email" href="mailto:info@purewaterpros\.ca">info@purewaterpros\.ca</a>)\s*(<a class="footer-email" href="tel:\+17784001267">778-400-1267</a>)',
                  r'\1\n<br/>\n\2',
                  text,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          forbidden = {
              'Opening September 2026': re.compile(r'Opening September 2026', re.I),
              'Opening August 2026': re.compile(r'Opening August 2026', re.I),
              'pre-launch': re.compile(r'pre-launch', re.I),
              'preparing to provide': re.compile(r'preparing to provide', re.I),
              'scheduling opens': re.compile(r'scheduling opens', re.I),
              'Advance appointment requests': re.compile(r'Advance appointment requests', re.I),
              'Request a September appointment': re.compile(r'Request a September appointment', re.I),
              'August follow-up': re.compile(r'August follow-up', re.I),
          }

          failures = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for label, pattern in forbidden.items():
                  if pattern.search(text):
                      failures.append(f'{path}: still contains {label!r}')

          if failures:
              raise SystemExit('\n'.join(failures))

          Path('/tmp/changed-files.txt').write_text('\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8')
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')

      - name: Review diff
        run: git diff --check && git diff --stat && git diff

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Pure Water Pros Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html water-filtration-victoria.html water-softeners-victoria.html reverse-osmosis-victoria.html uv-water-treatment-victoria.html iron-sulfur-water-treatment-victoria.html chemical-injection-water-treatment-victoria.html low-yield-well-storage-victoria.html water-treatment-service-victoria.html service-areas.html water-treatment-langford-west-shore.html privacy-policy.html contact.html thank-you.html
          git commit -m "Remove stale launch language across public website"
          git push origin main

      - name: Build GreenGeeks replacement package
        run: |
          mkdir -p greengeeks-sitewide-update
          if [ -s /tmp/changed-files.txt ]; then
            while IFS= read -r file; do
              cp "$file" greengeeks-sitewide-update/
            done < /tmp/changed-files.txt
          fi
          cat > greengeeks-sitewide-update/UPLOAD-INSTRUCTIONS.txt <<'EOF'
          Pure Water Pros — Sitewide September soft-launch cleanup

          Upload each HTML file in this folder to the live Pure Water Pros document root in GreenGeeks and choose overwrite/replace.

          This package removes stale Opening September / pre-launch wording, changes appointment CTAs to Request service, and stacks the footer phone number below the email address.

          Do not delete unrelated files or folders from GreenGeeks.
          EOF
          (cd greengeeks-sitewide-update && zip -r ../PureWaterPros-GreenGeeks-Sitewide-Soft-Launch.zip .)

      - name: Upload GreenGeeks package
        uses: actions/upload-artifact@v4
        with:
          name: PureWaterPros-GreenGeeks-Sitewide-Soft-Launch
          path: PureWaterPros-GreenGeeks-Sitewide-Soft-Launch.zip
          retention-days: 7
