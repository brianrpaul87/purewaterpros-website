name: Navigation label cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nav-label-cleanup.yml

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update header navigation labels
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('index.html'),
              Path('water-filtration-victoria.html'),
              Path('water-softeners-victoria.html'),
              Path('reverse-osmosis-victoria.html'),
              Path('uv-water-treatment-victoria.html'),
              Path('iron-sulfur-water-treatment-victoria.html'),
              Path('chemical-injection-water-treatment-victoria.html'),
              Path('low-yield-well-storage-victoria.html'),
              Path('water-treatment-service-victoria.html'),
              Path('service-areas.html'),
              Path('water-treatment-langford-west-shore.html'),
              Path('privacy-policy.html'),
          ]

          old = '<a href="/service-areas.html">Service areas</a>'
          new = '<a href="/service-areas.html">Areas We Serve</a>'
          changed = []

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  updated = text.replace(old, new)
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No header navigation labels were changed.')

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  raise SystemExit(f'{path}: stale Service areas header link remains')

          Path('/tmp/changed-files.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('Changed files:')
          print('\n'.join(changed))

      - name: Review diff
        run: git diff --check && git diff --stat && git diff

      - name: Commit navigation label update
        run: |
          git config user.name "Pure Water Pros Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html water-filtration-victoria.html water-softeners-victoria.html reverse-osmosis-victoria.html uv-water-treatment-victoria.html iron-sulfur-water-treatment-victoria.html chemical-injection-water-treatment-victoria.html low-yield-well-storage-victoria.html water-treatment-service-victoria.html service-areas.html water-treatment-langford-west-shore.html privacy-policy.html
          git commit -m "Rename Service areas navigation label to Areas We Serve"
          git push origin main

      - name: Build GreenGeeks replacement package
        run: |
          mkdir -p greengeeks-nav-update
          while IFS= read -r file; do
            cp "$file" greengeeks-nav-update/
          done < /tmp/changed-files.txt
          cat > greengeeks-nav-update/UPLOAD-INSTRUCTIONS.txt <<'EOF'
          Pure Water Pros — navigation label correction

          Upload each HTML file in this folder to the live Pure Water Pros document root in GreenGeeks and choose overwrite/replace.

          Change included: the main header navigation label "Service areas" is now "Areas We Serve" across all current public pages. URLs, SEO page titles and footer service-area wording are unchanged.
          EOF
          (cd greengeeks-nav-update && zip -r ../PureWaterPros-GreenGeeks-Areas-We-Serve-Nav.zip .)

      - name: Upload GreenGeeks package
        uses: actions/upload-artifact@v4
        with:
          name: PureWaterPros-GreenGeeks-Areas-We-Serve-Nav
          path: PureWaterPros-GreenGeeks-Areas-We-Serve-Nav.zip
          retention-days: 7
