name: Temporary RO source staging helper

on:
  push:
    branches:
      - pwp-ro-binary-reconstruct-helper
    paths:
      - .github/workflows/reconstruct-ro-install-temp.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          ref: pwp-ro-binary-reconstruct-helper
          path: helper
      - name: Check out isolated working branch
        uses: actions/checkout@v4
        with:
          ref: pwp-ro-install-value-20260912
          fetch-depth: 0
          path: work
      - name: Apply and verify source edits
        run: python3 helper/tools/stage_ro_marketing.py work
      - name: Commit isolated source edits
        working-directory: work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html reverse-osmosis-victoria.html
          git commit -m 'Feature complete RO installation value and real project photo'
          git push origin HEAD:pwp-ro-install-value-20260912
