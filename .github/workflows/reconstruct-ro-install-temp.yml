name: Temporary RO image reconstruction helper

on:
  push:
    branches:
      - pwp-ro-binary-reconstruct-helper
    paths:
      - .github/workflows/reconstruct-ro-install-temp.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated working branch
        uses: actions/checkout@v4
        with:
          ref: pwp-ro-install-value-20260912
          fetch-depth: 0

      - name: Reconstruct and validate verified RO install image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ro-install

          cat \
            docs/internal/ro-live-full-q78.part1.b64 \
            docs/internal/ro-live-full-q78.part2.b64 \
            docs/internal/ro-live-full-q78.part3.b64 \
            docs/internal/ro-live-full-q78.part4.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            > /tmp/ro-install-decoded.bin

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          raw = Path('/tmp/ro-install-decoded.bin').read_bytes()
          if len(raw) < 12 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Decoded stream does not begin with a RIFF WebP')

          declared = struct.unpack('<I', raw[4:8])[0] + 8
          if declared < 30000 or declared > len(raw):
              raise SystemExit(f'Invalid RIFF size: declared={declared}, decoded={len(raw)}')

          image = raw[:declared]
          trailing = raw[declared:]
          out = Path('assets/ro-install/ro-install-langford-q78.webp')
          out.write_bytes(image)

          print(f'Decoded stream: {len(raw)} bytes')
          print(f'Extracted RIFF WebP: {len(image)} bytes')
          print(f'Trailing staged data excluded: {len(trailing)} bytes')
          print(f'Trailing prefix hex: {trailing[:16].hex()}')
          print(f'SHA256: {hashlib.sha256(image).hexdigest()}')
          PY

          file assets/ro-install/ro-install-langford-q78.webp
          file assets/ro-install/ro-install-langford-q78.webp | grep -Fq 'Web/P image'

          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('assets/ro-install/ro-install-langford-q78.webp').read_bytes()
          declared = struct.unpack('<I', data[4:8])[0] + 8
          if declared != len(data):
              raise SystemExit(f'Extracted WebP is incomplete: RIFF declares {declared}, file has {len(data)}')
          print(f'Validated exact complete RIFF WebP: {len(data)} bytes')
          PY

      - name: Commit image to isolated working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ro-install/ro-install-langford-q78.webp
          git diff --cached --quiet && { echo 'No image change to commit'; exit 0; }
          git commit -m 'Add verified Pure Water Pros RO install photo'
          git push origin HEAD:pwp-ro-install-value-20260912
