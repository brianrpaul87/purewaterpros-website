name: Deploy WTR realistic memorial images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-wtr-realistic-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: where-they-rest-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: mtl203.greengeeks.net
      FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
      REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}
    steps:
      - name: Check out Where They Rest
        uses: actions/checkout@v4
        with:
          repository: brianrpaul87/wheretheyrest
          ref: main
          path: wtr

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f wtr/index.html
          test -f wtr/trust.css
          test "$(wc -c < wtr/assets/memorial-care-before.webp)" -eq 10112
          test "$(wc -c < wtr/assets/memorial-care-after.webp)" -eq 9048
          grep -Fq 'memorial-care-before.webp?v=20260911' wtr/index.html
          grep -Fq 'memorial-care-after.webp?v=20260911' wtr/index.html
          grep -Fq 'Illustrative sample only.' wtr/index.html
          ! grep -Fq 'photo-placeholder before' wtr/index.html

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy visual bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"; ROOT="${ROOT%/}"
          TARGET="${ROOT}/wheretheyrest"; [ -n "$ROOT" ] || TARGET="/wheretheyrest"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put -O "$TARGET" wtr/index.html
          put -O "$TARGET" wtr/trust.css
          put -O "$TARGET/assets" wtr/assets/memorial-care-before.webp
          put -O "$TARGET/assets" wtr/assets/memorial-care-after.webp
          bye
          EOF

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          stamp="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "https://wheretheyrest.ca/?v=$stamp" -o /tmp/home
          grep -Fq 'memorial-care-before.webp?v=20260911' /tmp/home
          grep -Fq 'memorial-care-after.webp?v=20260911' /tmp/home
          grep -Fq 'Illustrative sample only.' /tmp/home
          ! grep -Fq 'photo-placeholder before' /tmp/home
          curl -fsSL "https://wheretheyrest.ca/assets/memorial-care-before.webp?v=$stamp" -o /tmp/before.webp
          curl -fsSL "https://wheretheyrest.ca/assets/memorial-care-after.webp?v=$stamp" -o /tmp/after.webp
          test "$(wc -c < /tmp/before.webp)" -eq 10112
          test "$(wc -c < /tmp/after.webp)" -eq 9048
          test "$(curl -sS -o /tmp/api -w '%{http_code}' 'https://wheretheyrest.ca/api/submit.php')" = '405'
          echo 'Live visual replacement verified.'
