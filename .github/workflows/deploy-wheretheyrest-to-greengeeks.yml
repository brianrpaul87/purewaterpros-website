name: Deploy Where They Rest to GreenGeeks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-wheretheyrest-to-greengeeks.yml'
      - 'wtr-deploy-trigger.txt'

permissions:
  contents: read

concurrency:
  group: where-they-rest-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: mtl203.greengeeks.net
      FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
      REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Check out Where They Rest source
        uses: actions/checkout@v4
        with:
          repository: brianrpaul87/wheretheyrest
          ref: main
          path: wtr-source

      - name: Validate public launch bundle
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html script.js trust.css privacy.html terms.html grave-cleaning-memorial-care-victoria-bc.html sitemap.xml .htaccess; do
            test -f "wtr-source/$file"
          done
          test -n "$FTP_USERNAME" || { echo 'Missing GREENGEEKS_FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing GREENGEEKS_FTP_PASSWORD secret'; exit 1; }
          node --check wtr-source/script.js
          grep -Fq 'G-0Z06XS20YT' wtr-source/index.html
          grep -Fq 'About Where They Rest' wtr-source/index.html
          grep -Fq 'From $129 CAD' wtr-source/index.html
          grep -Fq 'Starting in Greater Victoria' wtr-source/index.html
          grep -Fq 'Privacy Policy' wtr-source/privacy.html
          grep -Fq 'Terms of Service' wtr-source/terms.html
          grep -Fq 'Grave cleaning and memorial care in Victoria, BC' wtr-source/grave-cleaning-memorial-care-victoria-bc.html
          grep -Fq 'grave-cleaning-memorial-care-victoria-bc.html' wtr-source/sitemap.xml
          grep -Fq 'CacheDisable public /' wtr-source/.htaccess
          grep -Fq 'RewriteRule ^(?:config|tests|vendor|wheretheyrest)' wtr-source/.htaccess
          grep -Fq 'PACKAGE-SHA256SUMS' wtr-source/.htaccess
          grep -Fq 'X-Content-Type-Options' wtr-source/.htaccess
          ! grep -Fq 'Where They Rest is in preliminary development' wtr-source/index.html
          ! grep -Fq 'Authorized Memorial Steward' wtr-source/index.html

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Confirm existing server security rules
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"
          ROOT="${ROOT%/}"
          TARGET="${ROOT}/wheretheyrest"
          if [ -z "$ROOT" ]; then TARGET="/wheretheyrest"; fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          get "$TARGET/.htaccess" -o /tmp/current-wtr-htaccess
          bye
          EOF
          grep -Fq 'Options -Indexes' /tmp/current-wtr-htaccess
          grep -Fq 'DirectoryIndex index.html' /tmp/current-wtr-htaccess
          grep -Fq 'RewriteRule ^(?:config|tests|vendor|wheretheyrest)' /tmp/current-wtr-htaccess
          grep -Fq 'PACKAGE-SHA256SUMS' /tmp/current-wtr-htaccess
          grep -Fq 'X-Content-Type-Options' /tmp/current-wtr-htaccess
          grep -Fq 'Referrer-Policy' /tmp/current-wtr-htaccess
          echo 'Existing production protections confirmed.'

      - name: Deploy public launch bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"
          ROOT="${ROOT%/}"
          TARGET="${ROOT}/wheretheyrest"
          if [ -z "$ROOT" ]; then TARGET="/wheretheyrest"; fi

          echo "Deploying Where They Rest launch bundle to ${TARGET}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put -O "$TARGET" wtr-source/index.html
          put -O "$TARGET" wtr-source/script.js
          put -O "$TARGET" wtr-source/trust.css
          put -O "$TARGET" wtr-source/privacy.html
          put -O "$TARGET" wtr-source/terms.html
          put -O "$TARGET" wtr-source/grave-cleaning-memorial-care-victoria-bc.html
          put -O "$TARGET" wtr-source/sitemap.xml
          put -O "$TARGET" wtr-source/.htaccess
          bye
          EOF

      - name: Verify server files over FTP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"
          ROOT="${ROOT%/}"
          TARGET="${ROOT}/wheretheyrest"
          if [ -z "$ROOT" ]; then TARGET="/wheretheyrest"; fi
          mkdir -p /tmp/wtr-remote
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          get "$TARGET/index.html" -o /tmp/wtr-remote/index.html
          get "$TARGET/script.js" -o /tmp/wtr-remote/script.js
          get "$TARGET/trust.css" -o /tmp/wtr-remote/trust.css
          get "$TARGET/privacy.html" -o /tmp/wtr-remote/privacy.html
          get "$TARGET/terms.html" -o /tmp/wtr-remote/terms.html
          get "$TARGET/grave-cleaning-memorial-care-victoria-bc.html" -o /tmp/wtr-remote/grave-cleaning-memorial-care-victoria-bc.html
          get "$TARGET/sitemap.xml" -o /tmp/wtr-remote/sitemap.xml
          get "$TARGET/.htaccess" -o /tmp/wtr-remote/.htaccess
          bye
          EOF
          for file in index.html script.js trust.css privacy.html terms.html grave-cleaning-memorial-care-victoria-bc.html sitemap.xml .htaccess; do
            repo_sha="$(sha256sum "wtr-source/$file" | awk '{print $1}')"
            remote_sha="$(sha256sum "/tmp/wtr-remote/$file" | awk '{print $1}')"
            echo "$file REPO=$repo_sha REMOTE=$remote_sha"
            test "$repo_sha" = "$remote_sha"
          done
          echo 'FTP server files match repository exactly.'

      - name: Verify live Where They Rest
        shell: bash
        run: |
          set -euo pipefail
          sleep 3

          fetch_live() {
            local label="$1"
            local url="$2"
            local tmp_file="$3"
            local http
            http="$(curl -sS -L --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o "$tmp_file" -w '%{http_code}' "$url")"
            echo "$label HTTP=$http"
            test "$http" = '200'
          }

          stamp="${GITHUB_SHA}-$(date +%s)"
          fetch_live 'WTR_HOME' "https://wheretheyrest.ca/?deploy-check=${stamp}" '/tmp/live-wtr-index.html'
          fetch_live 'WTR_SCRIPT' "https://wheretheyrest.ca/script.js?deploy-check=${stamp}" '/tmp/live-wtr-script.js'
          fetch_live 'WTR_TRUST_CSS' "https://wheretheyrest.ca/trust.css?deploy-check=${stamp}" '/tmp/live-wtr-trust.css'
          fetch_live 'WTR_PRIVACY' "https://wheretheyrest.ca/privacy.html?deploy-check=${stamp}" '/tmp/live-wtr-privacy.html'
          fetch_live 'WTR_TERMS' "https://wheretheyrest.ca/terms.html?deploy-check=${stamp}" '/tmp/live-wtr-terms.html'
          fetch_live 'WTR_VICTORIA_PAGE' "https://wheretheyrest.ca/grave-cleaning-memorial-care-victoria-bc.html?deploy-check=${stamp}" '/tmp/live-wtr-victoria.html'

          grep -Fq 'G-0Z06XS20YT' /tmp/live-wtr-index.html
          grep -Fq 'About Where They Rest' /tmp/live-wtr-index.html
          grep -Fq 'From $129 CAD' /tmp/live-wtr-index.html
          grep -Fq 'Starting in Greater Victoria' /tmp/live-wtr-index.html
          grep -Fq 'Privacy Policy' /tmp/live-wtr-privacy.html
          grep -Fq 'Terms of Service' /tmp/live-wtr-terms.html
          grep -Fq 'Grave cleaning and memorial care in Victoria, BC' /tmp/live-wtr-victoria.html
          grep -Fq 'From $199 CAD' /tmp/live-wtr-victoria.html
          ! grep -Fq 'Where They Rest is in preliminary development' /tmp/live-wtr-index.html
          ! grep -Fq 'Authorized Memorial Steward' /tmp/live-wtr-index.html

          hero_http="$(curl -sS -L --retry 3 --retry-delay 2 -o /tmp/wtr-hero.jpg -w '%{http_code}' 'https://wheretheyrest.ca/assets/grave-memorial-cleaning-before-after.jpg')"
          echo "WTR_HERO HTTP=$hero_http"
          test "$hero_http" = '200'

          api_http="$(curl -sS -o /tmp/wtr-api-check.txt -w '%{http_code}' 'https://wheretheyrest.ca/api/submit.php')"
          echo "WTR_API GET HTTP=$api_http"
          test "$api_http" = '405'

          echo 'Where They Rest public launch verification passed.'

      - name: Deployment summary
        shell: bash
        run: |
          echo 'Where They Rest public launch bundle deployed successfully.'
          echo 'Production security rules and cache controls remain active.'
          echo 'Existing API, vendor files, assets, and private mail configuration were not modified.'
