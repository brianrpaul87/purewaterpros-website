name: Deploy Pure Water Pros website to GreenGeeks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/deploy-sulfur-article-to-greengeeks.yml'

permissions:
  contents: read

concurrency:
  group: pure-water-pros-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: mtl203.greengeeks.net
      FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
      REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .htaccess
          test -f sitemap.xml
          test -f blog/index.html
          test -f blog/greater-victoria-chloramine-water.html
          test -f blog/reverse-osmosis-victoria-do-you-need-ro.html
          test -f blog/well-water-rotten-egg-smell-vancouver-island.html
          test -f assets/blog/ro-components-hero-photo.webp
          test -f assets/well-water-sulfur-vancouver-island.webp
          test -n "$FTP_USERNAME" || { echo 'Missing GREENGEEKS_FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing GREENGEEKS_FTP_PASSWORD secret'; exit 1; }

      - name: Build production payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _deploy
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude '_deploy/' \
            --exclude 'wheretheyrest/' \
            --exclude 'wheretheyrest/**' \
            --exclude 'README*' \
            --exclude 'LICENSE*' \
            --exclude '.gitignore' \
            --exclude 'assets/image-hotlinks.json' \
            ./ _deploy/

          if find _deploy -maxdepth 1 -type d -name 'wheretheyrest' | grep -q .; then
            echo 'Safety stop: WhereTheyRest appeared in the Pure Water Pros deployment payload.'
            exit 1
          fi

          echo 'Skipping zero-byte placeholder files rather than overwriting production with them:'
          find _deploy -type f -empty -print || true
          find _deploy -type f -empty -delete

          echo "Production payload files: $(find _deploy -type f | wc -l)"
          echo "Production payload bytes: $(du -sb _deploy | awk '{print $1}')"

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy full website
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mirror -R --verbose --parallel=2 --exclude-glob wheretheyrest --exclude-glob 'wheretheyrest/**' _deploy "$ROOT"
          put -O "$ROOT" _deploy/.htaccess
          bye
          EOF

      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail

          verify_exact() {
            local label="$1"
            local url="$2"
            local repo_file="$3"
            local tmp_file="$4"
            local http live_sha repo_sha

            http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o "$tmp_file" -w '%{http_code}' "$url")"
            echo "$label HTTP=$http"
            test "$http" = '200'

            live_sha="$(sha256sum "$tmp_file" | awk '{print $1}')"
            repo_sha="$(sha256sum "$repo_file" | awk '{print $1}')"
            echo "$label LIVE_SHA256=$live_sha"
            echo "$label REPO_SHA256=$repo_sha"
            test "$live_sha" = "$repo_sha"
          }

          verify_exact \
            'HOME' \
            "https://www.purewaterpros.ca/?deploy-check=${GITHUB_SHA}" \
            'index.html' \
            '/tmp/live-home.html'

          verify_exact \
            'BLOG_INDEX' \
            "https://www.purewaterpros.ca/blog/index.html?deploy-check=${GITHUB_SHA}" \
            'blog/index.html' \
            '/tmp/live-blog-index.html'

          verify_exact \
            'CHLORAMINE_ARTICLE' \
            "https://www.purewaterpros.ca/blog/greater-victoria-chloramine-water.html?deploy-check=${GITHUB_SHA}" \
            'blog/greater-victoria-chloramine-water.html' \
            '/tmp/live-chloramine.html'

          verify_exact \
            'RO_ARTICLE' \
            "https://www.purewaterpros.ca/blog/reverse-osmosis-victoria-do-you-need-ro.html?deploy-check=${GITHUB_SHA}" \
            'blog/reverse-osmosis-victoria-do-you-need-ro.html' \
            '/tmp/live-ro-article.html'

          verify_exact \
            'SULFUR_ARTICLE' \
            "https://www.purewaterpros.ca/blog/well-water-rotten-egg-smell-vancouver-island.html?deploy-check=${GITHUB_SHA}" \
            'blog/well-water-rotten-egg-smell-vancouver-island.html' \
            '/tmp/live-sulfur.html'

          verify_exact \
            'SITEMAP' \
            "https://www.purewaterpros.ca/sitemap.xml?deploy-check=${GITHUB_SHA}" \
            'sitemap.xml' \
            '/tmp/live-sitemap.xml'

          ro_hero_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-ro-hero.webp -w '%{http_code}' "https://www.purewaterpros.ca/assets/blog/ro-components-hero-photo.webp?deploy-check=${GITHUB_SHA}")"
          echo "RO_HERO HTTP=$ro_hero_http"
          test "$ro_hero_http" = '200'
          ro_hero_live_sha="$(sha256sum /tmp/live-ro-hero.webp | awk '{print $1}')"
          ro_hero_repo_sha="$(sha256sum assets/blog/ro-components-hero-photo.webp | awk '{print $1}')"
          echo "RO_HERO LIVE_SHA256=$ro_hero_live_sha"
          echo "RO_HERO REPO_SHA256=$ro_hero_repo_sha"
          test "$ro_hero_live_sha" = "$ro_hero_repo_sha"
          file /tmp/live-ro-hero.webp | grep -Fq 'Web/P image'
          grep -Fq '/assets/blog/ro-components-hero-photo.webp' /tmp/live-ro-article.html

          sulfur_hero_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-sulfur-hero.webp -w '%{http_code}' "https://www.purewaterpros.ca/assets/well-water-sulfur-vancouver-island.webp?deploy-check=${GITHUB_SHA}")"
          echo "SULFUR_HERO HTTP=$sulfur_hero_http"
          test "$sulfur_hero_http" = '200'
          test "$(sha256sum /tmp/live-sulfur-hero.webp | awk '{print $1}')" = "$(sha256sum assets/well-water-sulfur-vancouver-island.webp | awk '{print $1}')"
          file /tmp/live-sulfur-hero.webp | grep -Fq 'Web/P image'

          grep -Fq '/assets/well-water-sulfur-vancouver-island.webp' /tmp/live-sulfur.html
          ! grep -Fq 'cdn.marblism.com/l8kmBsdipVs.webp' /tmp/live-sulfur.html

          echo 'Full-site production verification passed.'

      - name: Deployment summary
        shell: bash
        run: |
          echo 'Pure Water Pros production deployment completed successfully.'
          echo 'GitHub main is now the deployment source for Pure Water Pros site files.'
          echo 'The server-side wheretheyrest directory is explicitly excluded and must never be modified by this workflow.'
          echo 'Other server-only files are not deleted by this workflow.'
