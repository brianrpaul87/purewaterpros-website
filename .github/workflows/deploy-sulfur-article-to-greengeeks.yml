name: Deploy sulfur article to GreenGeeks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sulfur-article-to-greengeeks.yml'
      - 'assets/well-water-sulfur-vancouver-island.webp'
      - 'blog/well-water-rotten-egg-smell-vancouver-island.html'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: mtl203.greengeeks.net
      FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
      REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/well-water-sulfur-vancouver-island.webp
          test -f blog/well-water-rotten-egg-smell-vancouver-island.html
          test -n "$FTP_USERNAME" || { echo 'Missing GREENGEEKS_FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing GREENGEEKS_FTP_PASSWORD secret'; exit 1; }

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy hero image and article
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$ROOT"
          put -O assets assets/well-water-sulfur-vancouver-island.webp
          put -O blog blog/well-water-rotten-egg-smell-vancouver-island.html
          bye
          EOF

      - name: Diagnose and verify live production
        shell: bash
        run: |
          set -euo pipefail
          ARTICLE="https://www.purewaterpros.ca/blog/well-water-rotten-egg-smell-vancouver-island.html?deploy-check=${GITHUB_SHA}"
          HERO="https://www.purewaterpros.ca/assets/well-water-sulfur-vancouver-island.webp?deploy-check=${GITHUB_SHA}"

          article_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-article.html -w '%{http_code}' "$ARTICLE")"
          echo "ARTICLE_HTTP=$article_http"
          echo "LIVE_ARTICLE_BYTES=$(wc -c < /tmp/live-article.html)"
          echo "REPO_ARTICLE_BYTES=$(wc -c < blog/well-water-rotten-egg-smell-vancouver-island.html)"
          echo "LIVE_ARTICLE_SHA256=$(sha256sum /tmp/live-article.html | awk '{print $1}')"
          echo "REPO_ARTICLE_SHA256=$(sha256sum blog/well-water-rotten-egg-smell-vancouver-island.html | awk '{print $1}')"
          echo 'Hero references visible in live HTML:'
          grep -Eo 'https://cdn\.marblism\.com/[A-Za-z0-9_-]+\.webp|/assets/well-water-sulfur-vancouver-island\.webp' /tmp/live-article.html | sort -u || true

          hero_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-hero.webp -w '%{http_code}' "$HERO")"
          echo "HERO_HTTP=$hero_http"
          echo "LIVE_HERO_BYTES=$(wc -c < /tmp/live-hero.webp)"
          file /tmp/live-hero.webp || true

          test "$article_http" = '200'
          grep -Fq '/assets/well-water-sulfur-vancouver-island.webp' /tmp/live-article.html
          ! grep -Fq 'cdn.marblism.com/l8kmBsdipVs.webp' /tmp/live-article.html
          test "$hero_http" = '200'
          test -s /tmp/live-hero.webp
          file /tmp/live-hero.webp | grep -Fq 'Web/P image'
          echo 'Live production verification passed.'

      - name: Confirm deployed paths
        shell: bash
        run: |
          echo 'Deployed and verified:'
          echo '  /assets/well-water-sulfur-vancouver-island.webp'
          echo '  /blog/well-water-rotten-egg-smell-vancouver-island.html'
