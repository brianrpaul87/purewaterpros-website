name: Deploy Pure Water Pros website to GreenGeeks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!docs/**'
      - '!.github/**'
      - '.github/workflows/deploy-sulfur-article-to-greengeeks.yml'

permissions:
  contents: read

concurrency:
  group: pure-water-pros-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: mtl203.greengeeks.net
      FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
      REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}
      RO_HERO_SHA256: a9d2d6f21c3fb4aabdfb491c3c1dc863b1cbb4a5379bf853d42aa40bbde78ee0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .htaccess
          test -f sitemap.xml
          test -f blog/index.html
          test -f blog/greater-victoria-chloramine-water.html
          test -f blog/reverse-osmosis-victoria-do-you-need-ro.html
          test -f blog/well-water-rotten-egg-smell-vancouver-island.html
          test -f docs/internal/ro-hero-hd.part1.b64
          test -f docs/internal/ro-hero-hd.part2.b64
          test -f docs/internal/ro-hero-hd.part3.b64
          test -f docs/internal/ro-hero-hd.part4.b64
          test -f assets/well-water-sulfur-vancouver-island.webp
          test -n "$FTP_USERNAME" || { echo 'Missing GREENGEEKS_FTP_USERNAME secret'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing GREENGEEKS_FTP_PASSWORD secret'; exit 1; }

      - name: Build production payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _deploy
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude '_deploy/' \
            --exclude 'wheretheyrest/' \
            --exclude 'wheretheyrest/**' \
            --exclude 'README*' \
            --exclude 'LICENSE*' \
            --exclude '.gitignore' \
            --exclude 'assets/image-hotlinks.json' \
            --exclude 'assets/blog/*.b64' \
            --exclude 'assets/blog/*.base64.txt' \
            ./ _deploy/

          if find _deploy -maxdepth 1 -type d -name 'wheretheyrest' | grep -q .; then
            echo 'Safety stop: WhereTheyRest appeared in the Pure Water Pros deployment payload.'
            exit 1
          fi

          # Reconstruct the exact 1200x833 RO hero from small repository-safe
          # base64 chunks. This avoids binary corruption through connector writes.
          mkdir -p _deploy/assets/blog
          cat \
            docs/internal/ro-hero-hd.part1.b64 \
            docs/internal/ro-hero-hd.part2.b64 \
            docs/internal/ro-hero-hd.part3.b64 \
            docs/internal/ro-hero-hd.part4.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            > _deploy/assets/blog/ro-components-hero-hd.webp

          test "$(stat -c%s _deploy/assets/blog/ro-components-hero-hd.webp)" = '38940'
          hero_sha="$(sha256sum _deploy/assets/blog/ro-components-hero-hd.webp | awk '{print $1}')"
          echo "RO_HD_HERO BUILD_SHA256=$hero_sha"
          test "$hero_sha" = "$RO_HERO_SHA256"
          file _deploy/assets/blog/ro-components-hero-hd.webp | grep -Fq 'Web/P image'

          # Use the HD hero everywhere in the production copy of the RO article,
          # including social metadata and Article schema, and update its intrinsic
          # dimensions without altering article copy or layout.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_deploy/blog/reverse-osmosis-victoria-do-you-need-ro.html')
          s = p.read_text(encoding='utf-8')
          old = 'ro-components-hero-photo.webp'
          new = 'ro-components-hero-hd.webp'
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 old RO hero references; found {count}')
          s = s.replace(old, new)
          old_dims = 'width="1000" height="750"'
          if old_dims not in s:
              raise SystemExit('Expected RO hero intrinsic dimensions were not found')
          s = s.replace(old_dims, 'width="1200" height="833"', 1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq '/assets/blog/ro-components-hero-hd.webp' _deploy/blog/reverse-osmosis-victoria-do-you-need-ro.html
          ! grep -Fq '/assets/blog/ro-components-hero-photo.webp' _deploy/blog/reverse-osmosis-victoria-do-you-need-ro.html

          echo 'Skipping zero-byte placeholder files rather than overwriting production with them:'
          find _deploy -type f -empty -print || true
          find _deploy -type f -empty -delete

          echo "Production payload files: $(find _deploy -type f | wc -l)"
          echo "Production payload bytes: $(du -sb _deploy | awk '{print $1}')"

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy full website
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${REMOTE_ROOT:-/}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mirror -R --verbose --parallel=2 --exclude-glob wheretheyrest --exclude-glob 'wheretheyrest/**' _deploy "$ROOT"
          put -O "$ROOT" _deploy/.htaccess
          bye
          EOF

      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail

          verify_exact() {
            local label="$1"
            local url="$2"
            local repo_file="$3"
            local tmp_file="$4"
            local http live_sha repo_sha

            http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o "$tmp_file" -w '%{http_code}' "$url")"
            echo "$label HTTP=$http"
            test "$http" = '200'

            live_sha="$(sha256sum "$tmp_file" | awk '{print $1}')"
            repo_sha="$(sha256sum "$repo_file" | awk '{print $1}')"
            echo "$label LIVE_SHA256=$live_sha"
            echo "$label REPO_SHA256=$repo_sha"
            test "$live_sha" = "$repo_sha"
          }

          # Verify the live article actually references the new cache-busting HD
          # filename, and never silently fall back to the old low-resolution hero.
          ro_article_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-ro-article.html -w '%{http_code}' "https://www.purewaterpros.ca/blog/reverse-osmosis-victoria-do-you-need-ro.html?deploy-check=${GITHUB_SHA}")"
          echo "RO_ARTICLE HTTP=$ro_article_http"
          test "$ro_article_http" = '200'
          grep -Fq '/assets/blog/ro-components-hero-hd.webp' /tmp/live-ro-article.html
          ! grep -Fq '/assets/blog/ro-components-hero-photo.webp' /tmp/live-ro-article.html
          grep -Fq 'width="1200" height="833"' /tmp/live-ro-article.html

          ro_hero_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-ro-hero.webp -w '%{http_code}' "https://www.purewaterpros.ca/assets/blog/ro-components-hero-hd.webp?deploy-check=${GITHUB_SHA}")"
          echo "RO_HD_HERO HTTP=$ro_hero_http"
          test "$ro_hero_http" = '200'
          ro_hero_live_sha="$(sha256sum /tmp/live-ro-hero.webp | awk '{print $1}')"
          echo "RO_HD_HERO LIVE_SHA256=$ro_hero_live_sha"
          echo "RO_HD_HERO EXPECTED_SHA256=$RO_HERO_SHA256"
          test "$ro_hero_live_sha" = "$RO_HERO_SHA256"
          test "$(stat -c%s /tmp/live-ro-hero.webp)" = '38940'
          file /tmp/live-ro-hero.webp | grep -Fq 'Web/P image'
          echo 'RO_HD_HERO VERIFIED: live 1200x833 asset exactly matches the approved HD source.'

          # The homepage can be transformed/cached by the hosting layer, so
          # verify availability and a stable content marker rather than bytes.
          home_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-home.html -w '%{http_code}' "https://www.purewaterpros.ca/?deploy-check=${GITHUB_SHA}")"
          echo "HOME HTTP=$home_http"
          test "$home_http" = '200'
          grep -Fq 'Pure Water Pros' /tmp/live-home.html

          verify_exact \
            'BLOG_INDEX' \
            "https://www.purewaterpros.ca/blog/index.html?deploy-check=${GITHUB_SHA}" \
            'blog/index.html' \
            '/tmp/live-blog-index.html'

          verify_exact \
            'CHLORAMINE_ARTICLE' \
            "https://www.purewaterpros.ca/blog/greater-victoria-chloramine-water.html?deploy-check=${GITHUB_SHA}" \
            'blog/greater-victoria-chloramine-water.html' \
            '/tmp/live-chloramine.html'

          verify_exact \
            'SULFUR_ARTICLE' \
            "https://www.purewaterpros.ca/blog/well-water-rotten-egg-smell-vancouver-island.html?deploy-check=${GITHUB_SHA}" \
            'blog/well-water-rotten-egg-smell-vancouver-island.html' \
            '/tmp/live-sulfur.html'

          verify_exact \
            'SITEMAP' \
            "https://www.purewaterpros.ca/sitemap.xml?deploy-check=${GITHUB_SHA}" \
            'sitemap.xml' \
            '/tmp/live-sitemap.xml'

          sulfur_hero_http="$(curl -sS -L --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/live-sulfur-hero.webp -w '%{http_code}' "https://www.purewaterpros.ca/assets/well-water-sulfur-vancouver-island.webp?deploy-check=${GITHUB_SHA}")"
          echo "SULFUR_HERO HTTP=$sulfur_hero_http"
          test "$sulfur_hero_http" = '200'
          test "$(sha256sum /tmp/live-sulfur-hero.webp | awk '{print $1}')" = "$(sha256sum assets/well-water-sulfur-vancouver-island.webp | awk '{print $1}')"
          file /tmp/live-sulfur-hero.webp | grep -Fq 'Web/P image'

          grep -Fq '/assets/well-water-sulfur-vancouver-island.webp' /tmp/live-sulfur.html
          ! grep -Fq 'cdn.marblism.com/l8kmBsdipVs.webp' /tmp/live-sulfur.html

          echo 'Full-site production verification passed.'

      - name: Deployment summary
        shell: bash
        run: |
          echo 'Pure Water Pros production deployment completed successfully.'
          echo 'GitHub main is now the deployment source for Pure Water Pros site files.'
          echo 'The server-side wheretheyrest directory is explicitly excluded and must never be modified by this workflow.'
          echo 'Other server-only files are not deleted by this workflow.'
