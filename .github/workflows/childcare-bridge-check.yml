name: Publish direct voice and message dictation
on:
  push:
    branches: [codex/childcare-deployment-bridge]
    paths: [.github/workflows/childcare-bridge-check.yml]
permissions:
  contents: write
concurrency:
  group: childcare-harbour-bridge
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate one-time transfer key and publish its public half
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out harbour-key.pem 2>/dev/null
          openssl pkey -in harbour-key.pem -pubout -out harbour-public.pem
          python3 - <<'PY'
          import base64,json,os,urllib.request
          public=open('harbour-public.pem','rb').read()
          payload=json.dumps({'message':'Publish one-time transfer public key','content':base64.b64encode(public).decode(),'branch':'codex/childcare-deployment-bridge'}).encode()
          req=urllib.request.Request('https://api.github.com/repos/brianrpaul87/purewaterpros-website/contents/childcare-bridge/8b7f786-public.pem',data=payload,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status != 201: raise RuntimeError('Public-key publication failed')
          print('One-time public key is ready.')
          PY
      - name: Wait for encrypted release and verify original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import base64,json,time,urllib.request,urllib.error,os
          url='https://api.github.com/repos/brianrpaul87/purewaterpros-website/contents/childcare-bridge/8b7f786-payload.json?ref=codex%2Fchildcare-deployment-bridge'
          for i in range(170):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}),timeout=15) as r: obj=json.load(r)
                  payload=json.loads(base64.b64decode(obj['content']))
                  open('harbour-key.enc','wb').write(base64.b64decode(payload['key'],validate=True))
                  open('harbour-release.enc','wb').write(base64.b64decode(payload['data'],validate=True))
                  print('Encrypted package received.')
                  break
              except urllib.error.HTTPError as e:
                  if e.code != 404: raise
                  time.sleep(5)
          else: raise TimeoutError('Encrypted release did not arrive')
          PY
          openssl pkeyutl -decrypt -inkey harbour-key.pem -in harbour-key.enc -out harbour-pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:harbour-pass.txt -in harbour-release.enc -out harbour-release.tar.gz
          echo '25f3c33d32277313fa463f15c40c9b5ebc3ca0bf0fb08dd06bad458af05be1ac  harbour-release.tar.gz' | sha256sum -c
          mkdir harbour-release
          tar -xzf harbour-release.tar.gz -C harbour-release
          rm -f harbour-key.pem harbour-pass.txt
      - name: Deploy and verify only the Childcare Harbour folder
        env:
          GREENGEEKS_FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
          GREENGEEKS_FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
          GREENGEEKS_REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}
          GITHUB_SHA: 8b7f786b50174b76180095765e41f150734cff50
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/harbour-release"
          python3 verify-hosted-release.py before
          python3 scripts/deploy-greengeeks.py
          python3 verify-hosted-release.py after
