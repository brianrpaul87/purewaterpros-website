name: Complete approved Childcare Harbour account activation
on:
  push:
    branches: [codex/childcare-deployment-bridge]
    paths: [.github/workflows/childcare-bridge-check.yml]
permissions:
  contents: read
concurrency:
  group: childcare-harbour-bridge
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Activate only the isolated app and verify public signup
        env:
          GREENGEEKS_FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
          GREENGEEKS_FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
          GREENGEEKS_REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}
        run: python3 childcare-bridge/activation-tools/complete-live-activation.py
