name: Check Childcare Harbour hosting connection safely
on:
  push:
    branches: [codex/childcare-deployment-bridge]
    paths: [.github/workflows/childcare-bridge-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect connection and deployment lock without changes
        env:
          GREENGEEKS_FTP_USERNAME: ${{ secrets.GREENGEEKS_FTP_USERNAME }}
          GREENGEEKS_FTP_PASSWORD: ${{ secrets.GREENGEEKS_FTP_PASSWORD }}
          GREENGEEKS_REMOTE_ROOT: ${{ secrets.GREENGEEKS_REMOTE_ROOT }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,hashlib
          phase='connect'
          try:
              with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25) as ftp:
                  ftp.connect('mtl203.greengeeks.net',21)
                  phase='login';ftp.login(os.environ['GREENGEEKS_FTP_USERNAME'],os.environ['GREENGEEKS_FTP_PASSWORD'])
                  phase='secure data';ftp.prot_p()
                  root=os.environ.get('GREENGEEKS_REMOTE_ROOT','').rstrip('/')
                  if root not in ('','/public_html','/home/purewat1/public_html'): raise ValueError('Unexpected FTP root')
                  base=root+'/childcare-harbour'
                  phase='childcare directory';ftp.cwd(base)
                  if ftp.pwd().rstrip('/')!=base: raise ValueError('Unexpected directory')
                  phase='runtime read';data=io.BytesIO();ftp.retrbinary('RETR '+base+'/dist/assets.js',data.write)
                  print('New runtime assets present:',hashlib.sha256(data.getvalue()).hexdigest()=='e5984fb383c7e74df9dfb1fe6ee2938a14b1ec5c2e7a66c112f39c6e56689aba')
                  phase='lock inspection'
                  try:
                      ftp.cwd(base+'/.harbour-deploy/lock')
                      print('Deployment lock: present')
                  except ftplib.error_perm as e:
                      print('Deployment lock: missing or inaccessible',str(e)[:3])
                  print('Read-only inspection completed.')
          except Exception as e:
              print('Inspection failed at:',phase,'error type:',type(e).__name__)
              raise SystemExit(1)
          PY
